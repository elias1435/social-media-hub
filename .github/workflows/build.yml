name: Build verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  next-build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: social_hub
          MYSQL_USER: build
          MYSQL_PASSWORD: build
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: mysql://build:build@127.0.0.1:3306/social_hub
      AUTH_SECRET: local-build-only-secret-not-for-production
      AUTH_URL: http://localhost:3000
      META_APP_ID: "000000000000000"
      META_APP_SECRET: local-build-only
      META_REDIRECT_URI: http://localhost:3000/api/meta/callback
      META_LOGIN_CONFIG_ID: "000000000000000"
      SOCIAL_TOKEN_ENCRYPTION_KEY: local-build-only-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
